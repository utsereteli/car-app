<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto house</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="Auto house - მანქანების მონაცემების მართვის სისტემა">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="color">
    <meta name="apple-mobile-web-app-title" content="Auto house">
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/splash/iphone-se.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-8.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-8-plus.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/iphone-x.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/ipad.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="/splash/ipad-pro.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="apple-touch-icon" href="/logo.svg">
    <link rel="manifest" href="/manifest.json">
    
    <style>
        /* Critical CSS to prevent FOUC */
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(to bottom right, #f8fafc, #eff6ff, #eef2ff);
            min-height: 100vh;
            transition: background-color 0.3s ease, background-image 0.3s ease;
        }
        body.dark {
            background: linear-gradient(to bottom right, #0f172a, #1e293b, #1e1b4b);
        }
        
        /* Synchronize all dark mode transitions */
        * {
            transition-property: background-color, background-image, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-duration: 0.3s;
            transition-timing-function: ease;
        }
        
        /* Exclude specific elements that need faster transitions */
        button:hover,
        input:focus,
        select:focus,
        .custom-checkbox .checkmark {
            transition-duration: 0.15s;
        }
        .hidden {
            display: none;
        }
        
        /* Allow dark mode to override hidden class - specifically for dark mode toggle icons */
        .dark span.hidden.dark\:block,
        .dark span[data-feather="sun"].dark\:block {
            display: block !important;
        }
        
        /* PWA Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #4f46e5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        
        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        #splash-screen .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        #splash-screen .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        #splash-screen .text {
            color: white;
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.5rem;
            opacity: 0.9;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 dark:from-slate-900 dark:via-slate-800 dark:to-indigo-900 min-h-screen p-6">
    <!-- PWA Splash Screen -->
    <div id="splash-screen">
        <img src="/logo.svg" alt="Logo" class="logo">
        <div class="spinner"></div>
        <p class="text">მონაცემების ჩატვირთვა...</p>
    </div>
    
    <!-- Full Page Loader -->
    <div id="pageLoader" class="fixed inset-0 bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 dark:from-slate-900 dark:via-slate-800 dark:to-indigo-900 flex items-center justify-center z-50">
        <div class="flex flex-col items-center gap-4">
            <div class="w-16 h-16 border-4 border-blue-500 dark:border-blue-400 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-700 dark:text-slate-300 font-semibold text-lg">მონაცემების ჩატვირთვა...</p>
        </div>
    </div>
    
    <div id="mainContent" class="max-w-7xl mx-auto hidden">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-3 p-6 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm rounded-2xl border border-white/50 dark:border-slate-700/50 shadow-lg animate-fade-in-up">
            <div class="flex items-center gap-3">
                <img src="/logo.svg" alt="Logo" class="w-10 h-10">
                <h1 class="text-3xl font-bold bg-gradient-to-r from-slate-800 via-blue-700 to-indigo-700 dark:from-slate-200 dark:via-blue-400 dark:to-indigo-400 bg-clip-text text-transparent">Auto house</h1>
            </div>
            <div class="flex gap-3 flex-wrap items-center">
                <button
                    id="darkModeToggle"
                    class="px-4 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-700 dark:text-slate-300 transition-all duration-300 flex items-center gap-2 shadow-sm hover:shadow-md hover:scale-105 font-medium"
                    title="Dark Mode"
                >
                    <span data-feather="moon" class="w-4 h-4 dark:hidden block"></span>
                    <span data-feather="sun" class="w-4 h-4 hidden dark:block"></span>
                </button>
                <button
                    id="openAddModal"
                    class="px-6 py-2.5 bg-gradient-to-r from-blue-400 via-blue-500 to-indigo-500 dark:from-blue-500 dark:via-blue-600 dark:to-indigo-600 text-white rounded-xl hover:from-blue-500 hover:via-blue-600 hover:to-indigo-600 dark:hover:from-blue-600 dark:hover:via-blue-700 dark:hover:to-indigo-700 transition-all duration-300 flex items-center gap-2 shadow-md hover:shadow-lg hover:scale-105 font-medium"
                >
                    <span data-feather="plus" class="w-4 h-4"></span>
                    <span>დამატება</span>
                </button>
                <button
                    id="exportCSV"
                    class="px-6 py-2.5 bg-gradient-to-r from-emerald-400 via-emerald-500 to-teal-500 dark:from-emerald-500 dark:via-emerald-600 dark:to-teal-600 text-white rounded-xl hover:from-emerald-500 hover:via-emerald-600 hover:to-teal-600 dark:hover:from-emerald-600 dark:hover:via-emerald-700 dark:hover:to-teal-700 transition-all duration-300 flex items-center gap-2 shadow-md hover:shadow-lg hover:scale-105 font-medium"
                >
                    <span data-feather="download" class="w-4 h-4"></span>
                    <span>Export CSV</span>
                </button>
            </div>
        </header>

        <!-- Filters Section -->
        <section class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm p-5 rounded-2xl border border-white/50 dark:border-slate-700/50 shadow-lg mb-6 fade-in-up-delay-1">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-4 filters-container">
                <!-- ფილტრები JavaScript-ით გენერირდება -->
            </div>
            <div class="flex gap-3 items-center flex-wrap">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="ძებნა..."
                    class="p-3.5 border border-slate-200 dark:border-slate-600 rounded-xl flex-1 focus:outline-none focus:ring-2 focus:ring-blue-400/50 dark:focus:ring-blue-500/50 focus:border-blue-400 dark:focus:border-blue-500 bg-white/90 dark:bg-slate-700/90 text-slate-700 dark:text-slate-200 transition-all duration-300 shadow-sm hover:shadow-md hover:border-blue-300 dark:hover:border-blue-600 placeholder-slate-400 dark:placeholder-slate-400 font-medium"
                >
                <button
                    id="clearAllFilters"
                    class="px-6 h-[calc(0.875rem*2+1.5rem+2px)] md:h-[calc(0.875rem*2+1.5rem+2px)] bg-gradient-to-r from-slate-100 to-slate-200 dark:from-slate-700 dark:to-slate-600 hover:from-slate-200 hover:to-slate-300 dark:hover:from-slate-600 dark:hover:to-slate-500 border border-slate-300 dark:border-slate-600 hover:border-slate-400 dark:hover:border-slate-500 rounded-xl text-slate-700 dark:text-slate-200 transition-all duration-300 flex items-center justify-center gap-2 shadow-sm hover:shadow-md hover:scale-105 font-medium md:w-auto w-full mt-2 md:mt-0"
                >
                    <span data-feather="x-circle" class="w-4 h-4"></span>
                    <span>გასუფთავება</span>
                </button>
            </div>
        </section>

        <!-- Active Filters -->
        <div id="activeFilters" class="hidden flex flex-wrap gap-2 mb-6 p-4 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm rounded-2xl border border-white/50 dark:border-slate-700/50 shadow-lg fade-in-up-delay-2"></div>

        <!-- Table Container -->
        <div id="tableContainer" class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm md:border md:border-white/50 md:dark:border-slate-700/50 md:rounded-2xl p-6 table-wrapper relative shadow-lg fade-in-up-delay-3">
            <!-- Loader -->
            <div id="loader" class="hidden absolute inset-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-sm flex items-center justify-center z-10 rounded-2xl">
                <div class="flex flex-col items-center gap-4">
                    <div class="w-14 h-14 border-4 border-blue-400 dark:border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-slate-700 dark:text-slate-300 font-semibold">მონაცემების ჩატვირთვა...</p>
                </div>
            </div>
            
            <!-- Records Count and Column Visibility -->
            <div class="mb-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 p-4 bg-white dark:bg-slate-700 rounded-xl border border-slate-200/60 dark:border-slate-600/60 shadow-sm">
                <div id="recordsCount" class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-200">
                    <span data-feather="database" class="w-4 h-4 text-blue-500 dark:text-blue-400"></span>
                    <span class="font-medium">ჩანაწერების რაოდენობა: <span id="recordsCountNumber" class="text-blue-600 dark:text-blue-400 font-bold">0</span></span>
                </div>
                <div class="relative hidden md:block">
                    <button id="columnVisibilityBtn" class="px-5 py-2.5 bg-white/90 dark:bg-slate-600/90 hover:bg-white dark:hover:bg-slate-600 border border-slate-200 dark:border-slate-500 hover:border-slate-300 dark:hover:border-slate-400 rounded-xl text-sm text-slate-700 dark:text-slate-200 flex items-center gap-2 transition-all duration-300 shadow-sm hover:shadow-md hover:scale-105 font-medium">
                        <span data-feather="eye" class="w-4 h-4"></span>
                        <span>სვეტების ხილვადობა</span>
                    </button>
                    <div id="columnVisibilityMenu" class="hidden absolute right-0 mt-3 bg-white/95 dark:bg-slate-800/95 backdrop-blur-xl border border-white/50 dark:border-slate-700/50 rounded-2xl shadow-2xl p-4 z-50 min-w-[240px] max-h-[400px] overflow-y-auto animate-fade-in">
                        <div class="space-y-3">
                            <div class="text-sm font-bold bg-gradient-to-r from-slate-700 via-blue-600 to-indigo-600 dark:from-slate-200 dark:via-blue-400 dark:to-indigo-400 bg-clip-text text-transparent mb-3 pb-2.5 border-b border-slate-200/50 dark:border-slate-600/50">აირჩიეთ სვეტები</div>
                            <div id="columnVisibilityOptions" class="space-y-1.5"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="overflow-x-auto md:border md:border-slate-200 md:dark:border-slate-700 md:rounded-xl md:bg-white/50 md:dark:bg-slate-700/50">
                <table class="w-full text-left table-auto">
                    <thead>
                        <!-- Table header will be generated by JavaScript -->
                    </thead>
                    <tbody id="carList"></tbody>
                </table>
            </div>

                <!-- No Data Message -->
                <div id="noDataMessage" class="hidden py-12 text-center">
                    <div class="flex flex-col items-center gap-4 p-8 bg-gradient-to-br from-slate-50/80 to-blue-50/80 dark:from-slate-800/80 dark:to-slate-700/80 rounded-2xl border border-white/50 dark:border-slate-700/50">
                        <svg class="w-24 h-24 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.5"
                                d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                            ></path>
                        </svg>
                        <div>
                            <h3 class="text-xl font-semibold text-slate-700 dark:text-slate-300 mb-2">მონაცემები არ მოიძებნა</h3>
                            <p class="text-slate-600 dark:text-slate-400">სცადეთ სხვა ფილტრები ან ძებნის ტერმინი</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 flex items-center justify-center bg-gradient-to-br from-slate-900/50 via-blue-900/40 to-indigo-900/50 dark:from-slate-950/70 dark:via-slate-900/60 dark:to-slate-950/70 backdrop-blur-md z-50 overflow-y-auto p-4">
        <div class="bg-white/95 dark:bg-slate-800/95 backdrop-blur-2xl w-full max-w-2xl m-4 p-8 rounded-3xl border border-white/60 dark:border-slate-700/60 shadow-2xl transform transition-all duration-300 animate-fade-in">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200/50 dark:border-slate-600/50">
                <h2 id="modalTitle" class="text-3xl font-bold bg-gradient-to-r from-slate-800 via-blue-600 to-indigo-600 dark:from-slate-200 dark:via-blue-400 dark:to-indigo-400 bg-clip-text text-transparent">დამატება</h2>
                <button
                    id="closeModal"
                    class="text-slate-400 dark:text-slate-500 hover:text-rose-500 dark:hover:text-rose-400 transition-all duration-300 p-2 rounded-xl hover:bg-gradient-to-br hover:from-rose-50/80 hover:to-pink-50/80 dark:hover:from-rose-900/30 dark:hover:to-pink-900/30 transform hover:rotate-90 shadow-sm hover:shadow-md"
                >
                    <span data-feather="x" class="w-5 h-5"></span>
                </button>
            </div>
            <input type="hidden" id="editIndex">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 modal-fields-container">
                <!-- Modal-ის ველები JavaScript-ით გენერირდება -->
            </div>
            <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-slate-200/50 dark:border-slate-600/50">
                <button
                    id="saveCar"
                    class="px-8 py-3 bg-gradient-to-r from-emerald-500 via-emerald-600 to-teal-600 text-white rounded-xl hover:from-emerald-600 hover:via-emerald-700 hover:to-teal-700 transition-all duration-300 flex items-center gap-2 shadow-lg hover:shadow-xl hover:scale-105 font-semibold"
                >
                    <span data-feather="save" class="w-4 h-4"></span>
                    <span>შენახვა</span>
                </button>
            </div>
        </div>
    </div>

    </div>

    <!-- PWA Install Prompt -->
    <div id="installPrompt" class="hidden fixed bottom-0 left-0 right-0 md:bottom-6 md:left-1/2 md:right-auto md:transform md:-translate-x-1/2 z-50 max-w-md md:w-full md:mx-4 px-4 pb-4 md:pb-0 md:px-0">
        <div class="bg-white/95 dark:bg-slate-800/95 backdrop-blur-2xl rounded-2xl border border-white/60 dark:border-slate-700/60 shadow-2xl p-4 md:p-6 animate-fade-in-up">
            <div class="flex items-start gap-3 md:gap-4">
                <div class="flex-shrink-0">
                    <div class="w-12 h-12 md:w-16 md:h-16 bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-500 rounded-xl flex items-center justify-center shadow-lg">
                        <img src="/logo.svg" alt="Logo" class="w-8 h-8 md:w-10 md:h-10">
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="text-base md:text-lg font-bold text-slate-800 dark:text-slate-200 mb-1">დააინსტალირე Auto house</h3>
                    <p class="text-xs md:text-sm text-slate-600 dark:text-slate-400 mb-3 md:mb-4">დაამატე ეს აპლიკაცია შენს მოწყობილობაზე სწრაფი წვდომისთვის</p>
                    <div class="flex gap-2 md:gap-3">
                        <button
                            id="installBtn"
                            class="flex-1 px-4 py-2 md:px-5 md:py-2.5 bg-gradient-to-r from-blue-500 via-blue-600 to-indigo-600 text-white rounded-xl hover:from-blue-600 hover:via-blue-700 hover:to-indigo-700 transition-all duration-300 flex items-center justify-center gap-2 shadow-lg hover:shadow-xl hover:scale-105 font-semibold text-xs md:text-sm"
                        >
                            <span data-feather="download" class="w-3.5 h-3.5 md:w-4 md:h-4"></span>
                            <span>დააინსტალირე</span>
                        </button>
                        <button
                            id="dismissInstall"
                            class="px-4 py-2 md:px-5 md:py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 rounded-xl transition-all duration-300 flex items-center justify-center shadow-sm hover:shadow-md hover:scale-105 font-medium text-xs md:text-sm"
                        >
                            <span data-feather="x" class="w-3.5 h-3.5 md:w-4 md:h-4"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
